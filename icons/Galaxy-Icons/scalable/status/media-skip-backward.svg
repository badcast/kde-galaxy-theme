<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2238" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0B0E17" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <!-- Cosmic Squircle Tile -->
  <rect x="1.5" y="1.5" width="21" height="21" rx="5.5" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="1.2"/>
  <rect x="2.5" y="2.5" width="19" height="19" rx="4.5" fill="none" stroke="#F8FAFC" stroke-opacity="0.12" stroke-width="0.8"/>
  <!-- Glowing Neon Content -->
  <polygon points="17.5,7 10.5,12 17.5,17" fill="#00F0FF" stroke="#00F0FF" stroke-width="1.0" stroke-linejoin="round"/><line x1="7.5" y1="7" x2="7.5" y2="17" stroke="#00F0FF" stroke-width="2.0" stroke-linecap="round"/>
</svg>
