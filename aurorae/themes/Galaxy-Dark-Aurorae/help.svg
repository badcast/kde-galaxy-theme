<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="110" height="22" viewBox="0 0 110 22">
  <defs>
    <!-- Cyber Pod Active Background -->
    <linearGradient id="podBg_help" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161D36"/>
      <stop offset="100%" stop-color="#0B0E17"/>
    </linearGradient>

    <!-- Cyber Pod Active Border -->
    <linearGradient id="podBorder_help" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect id="hint-stretch-borders" x="0" y="0" width="1" height="1" fill="none"/>

  <!-- ========================================== -->
  <!-- 1. ACTIVE STATE (x=0..22, center=11)       -->
  <!-- ========================================== -->
  <g id="active-center">
    <rect x="0" y="0" width="22" height="22" fill="none"/>
    <!-- Deep Space Drop Shadow -->
    <rect x="1.5" y="2.5" width="19" height="19" rx="5" fill="#000000" opacity="0.4"/>
    <!-- Cosmic Squircle Pod Capsule -->
    <rect x="1.5" y="1.5" width="19" height="19" rx="5" fill="url(#podBg_help)" stroke="url(#podBorder_help)" stroke-width="1.2"/>
    <!-- Specular Inner Glass Rim -->
    <rect x="2.5" y="2.5" width="17" height="17" rx="4" fill="none" stroke="#F8FAFC" stroke-opacity="0.14" stroke-width="0.8"/>
    <!-- Illuminated Quantum Glyph -->
    <g opacity="1.0">
      <path d="M 8.4 9.0 C 8.4 6.5, 13.6 6.5, 13.6 9.2 C 13.6 10.6, 11 11.2, 11 12.6" fill="none" stroke="#FBBF24" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="11" cy="14.8" r="0.8450000000000001" fill="#FBBF24"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 2. HOVER STATE (x=22..44, center=33)       -->
  <!-- ========================================== -->
  <g id="hover-center">
    <rect x="22" y="0" width="22" height="22" fill="none"/>
    <!-- Radiant Glowing Laser Pod -->
    <rect x="23.5" y="1.5" width="19" height="19" rx="5" fill="#FDE047" fill-opacity="0.28" stroke="#F8FAFC" stroke-width="1.4"/>
    <rect x="24.5" y="2.5" width="17" height="17" rx="4" fill="none" stroke="#FBBF24" stroke-width="0.9" opacity="0.75"/>
    <!-- Luminous White-Hot Glyph -->
    <g opacity="1.0">
      <path d="M 30.4 9.0 C 30.4 6.5, 35.6 6.5, 35.6 9.2 C 35.6 10.6, 33 11.2, 33 12.6" fill="none" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="33" cy="14.8" r="1.125" fill="#F8FAFC"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 3. PRESSED STATE (x=44..66, center=55)     -->
  <!-- ========================================== -->
  <g id="pressed-center">
    <rect x="44" y="0" width="22" height="22" fill="none"/>
    <!-- Compressed Dark Matter Singularity Pod -->
    <rect x="46.0" y="2.5" width="17" height="17" rx="4" fill="#060810" stroke="#FBBF24" stroke-width="1.4"/>
    <!-- Compressed Glyph -->
    <g opacity="1.0">
      <path d="M 51.9 9.0 C 51.9 6.5, 57.1 6.5, 57.1 9.2 C 57.1 10.6, 54.5 11.2, 54.5 12.6" fill="none" stroke="#FDE047" stroke-width="1.1" stroke-linecap="round"/>
      <circle cx="54.5" cy="14.8" r="0.7150000000000001" fill="#FDE047"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 4. INACTIVE STATE (x=66..88, center=77)   -->
  <!-- ========================================== -->
  <g id="inactive-center">
    <rect x="66" y="0" width="22" height="22" fill="none"/>
    <!-- Stealthed Dark Stasis Pod -->
    <rect x="67.5" y="1.5" width="19" height="19" rx="5" fill="#060810" fill-opacity="0.6" stroke="#1C243E" stroke-width="1.0"/>
    <!-- Muted Stardust Glyph -->
    <g opacity="0.45">
      <path d="M 74.4 9.0 C 74.4 6.5, 79.6 6.5, 79.6 9.2 C 79.6 10.6, 77 11.2, 77 12.6" fill="none" stroke="#94A3B8" stroke-width="0.9" stroke-linecap="round"/>
      <circle cx="77" cy="14.8" r="0.5850000000000001" fill="#94A3B8"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 5. DEACTIVATED & INACTIVE HOVER (x=88..110) -->
  <!-- ========================================== -->
  <g id="deactivated-active-center">
    <rect x="88" y="0" width="22" height="22" fill="none"/>
    <rect x="89.5" y="1.5" width="19" height="19" rx="5" fill="#FBBF24" fill-opacity="0.15" stroke="#253256" stroke-width="1.0"/>
    <g opacity="0.6">
      <path d="M 96.4 9.0 C 96.4 6.5, 101.6 6.5, 101.6 9.2 C 101.6 10.6, 99 11.2, 99 12.6" fill="none" stroke="#94A3B8" stroke-width="0.9" stroke-linecap="round"/>
      <circle cx="99" cy="14.8" r="0.5850000000000001" fill="#94A3B8"/>
    </g>
  </g>
  <g id="deactivated-center">
    <rect x="88" y="0" width="22" height="22" fill="none"/>
    <rect x="89.5" y="1.5" width="19" height="19" rx="5" fill="#FBBF24" fill-opacity="0.15" stroke="#253256" stroke-width="1.0"/>
    <g opacity="0.6">
      <path d="M 96.4 9.0 C 96.4 6.5, 101.6 6.5, 101.6 9.2 C 101.6 10.6, 99 11.2, 99 12.6" fill="none" stroke="#94A3B8" stroke-width="0.9" stroke-linecap="round"/>
      <circle cx="99" cy="14.8" r="0.5850000000000001" fill="#94A3B8"/>
    </g>
  </g>
  <g id="inactive_hover-center">
    <rect x="88" y="0" width="22" height="22" fill="none"/>
    <rect x="89.5" y="1.5" width="19" height="19" rx="5" fill="#FBBF24" fill-opacity="0.15" stroke="#253256" stroke-width="1.0"/>
    <g opacity="0.6">
      <path d="M 96.4 9.0 C 96.4 6.5, 101.6 6.5, 101.6 9.2 C 101.6 10.6, 99 11.2, 99 12.6" fill="none" stroke="#94A3B8" stroke-width="0.9" stroke-linecap="round"/>
      <circle cx="99" cy="14.8" r="0.5850000000000001" fill="#94A3B8"/>
    </g>
  </g>
  <g id="hover-inactive-center">
    <rect x="88" y="0" width="22" height="22" fill="none"/>
    <rect x="89.5" y="1.5" width="19" height="19" rx="5" fill="#FBBF24" fill-opacity="0.15" stroke="#253256" stroke-width="1.0"/>
    <g opacity="0.6">
      <path d="M 96.4 9.0 C 96.4 6.5, 101.6 6.5, 101.6 9.2 C 101.6 10.6, 99 11.2, 99 12.6" fill="none" stroke="#94A3B8" stroke-width="0.9" stroke-linecap="round"/>
      <circle cx="99" cy="14.8" r="0.5850000000000001" fill="#94A3B8"/>
    </g>
  </g>
</svg>
