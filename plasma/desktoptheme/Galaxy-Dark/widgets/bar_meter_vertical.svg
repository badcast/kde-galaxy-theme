  <g id="bar-inactive-bottomleft"><path d="M 6 20 A 6 6 0 0 1 0 14 L 6 14 Z" fill="#0B0E17"/><path d="M 6 20 A 6 6 0 0 1 0 14" stroke="#2A3558" stroke-width="1" fill="none"/></g>
  <g id="bar-inactive-bottom"><rect x="6" y="14" width="8" height="6" fill="#0B0E17"/><line x1="6" y1="19.5" x2="14" y2="19.5" stroke="#2A3558" stroke-width="1"/></g>
  <g id="bar-inactive-bottomright"><path d="M 20 14 A 6 6 0 0 1 14 20 L 14 14 Z" fill="#0B0E17"/><path d="M 20 14 A 6 6 0 0 1 14 20" stroke="#2A3558" stroke-width="1" fill="none"/></g>

  <!-- Active Level Fill -->
  <g id="bar-active-center"><rect x="36" y="6" width="8" height="8" fill="url(#barActiveFill)"/></g>
  <g id="bar-active-topleft"><path d="M 30 6 A 6 6 0 0 1 36 0 L 36 6 Z" fill="url(#barActiveFill)"/></g>
