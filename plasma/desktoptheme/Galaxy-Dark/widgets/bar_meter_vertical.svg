  <!-- Inactive Groove (Smooth obsidian track) -->
  <g id="bar-inactive-center"><rect x="6" y="6" width="8" height="8" fill="#0B0E17"/></g>
  <g id="bar-inactive-topleft"><path d="M 0 6 A 6 6 0 0 1 6 0 L 6 6 Z" fill="#0B0E17"/><path d="M 0 6 A 6 6 0 0 1 6 0" stroke="#2A3558" stroke-width="1" fill="none"/></g>
  <g id="bar-inactive-top"><rect x="6" y="0" width="8" height="6" fill="#0B0E17"/><line x1="6" y1="0.5" x2="14" y2="0.5" stroke="#2A3558" stroke-width="1"/></g>
  <g id="bar-inactive-topright"><path d="M 14 0 A 6 6 0 0 1 20 6 L 14 6 Z" fill="#0B0E17"/><path d="M 14 0 A 6 6 0 0 1 20 6" stroke="#2A3558" stroke-width="1" fill="none"/></g>
  <g id="bar-inactive-left"><rect x="0" y="6" width="6" height="8" fill="#0B0E17"/><line x1="0.5" y1="6" x2="0.5" y2="14" stroke="#2A3558" stroke-width="1"/></g>
