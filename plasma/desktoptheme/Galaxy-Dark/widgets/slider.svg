<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grooveBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#141C30"/>
    </linearGradient>
    <linearGradient id="grooveActive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="handleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00C4D4"/>
    </radialGradient>
    <radialGradient id="handleGlowHover" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </radialGradient>
  </defs>

  <!-- Hints -->
  <rect id="hint-tile-center" x="0" y="0" width="1" height="1" fill="none"/>
  <rect id="hint-handle-size" x="0" y="0" width="26" height="26" fill="none"/>

  <!-- Inactive Groove (x=7..26, y=11..30) -->
  <g id="groove-topleft"><rect x="7" y="11" width="3" height="3" fill="#0B0E17"/><path d="M 7 14 A 3 3 0 0 1 10 11" stroke="#253256" stroke-width="0.8" fill="none"/></g>
  <g id="groove-top"><rect x="10" y="11" width="6" height="3" fill="#0B0E17"/><line x1="10" y1="11.4" x2="16" y2="11.4" stroke="#253256" stroke-width="0.8"/></g>
  <g id="groove-topright"><rect x="16" y="11" width="3" height="3" fill="#0B0E17"/><path d="M 16 11 A 3 3 0 0 1 19 14" stroke="#253256" stroke-width="0.8" fill="none"/></g>
  <g id="groove-left"><rect x="7" y="14" width="3" height="6" fill="#0B0E17"/><line x1="7.4" y1="14" x2="7.4" y2="20" stroke="#253256" stroke-width="0.8"/></g>
  <g id="groove-center"><rect x="10" y="14" width="6" height="6" fill="#0B0E17"/></g>
  <g id="groove-right"><rect x="16" y="14" width="3" height="6" fill="#0B0E17"/><line x1="18.6" y1="14" x2="18.6" y2="20" stroke="#253256" stroke-width="0.8"/></g>
  <g id="groove-bottomleft"><rect x="7" y="20" width="3" height="3" fill="#0B0E17"/><path d="M 10 23 A 3 3 0 0 1 7 20" stroke="#253256" stroke-width="0.8" fill="none"/></g>
  <g id="groove-bottom"><rect x="10" y="20" width="6" height="3" fill="#0B0E17"/><line x1="10" y1="22.6" x2="16" y2="22.6" stroke="#253256" stroke-width="0.8"/></g>
  <g id="groove-bottomright"><rect x="16" y="20" width="3" height="3" fill="#0B0E17"/><path d="M 19 20 A 3 3 0 0 1 16 23" stroke="#253256" stroke-width="0.8" fill="none"/></g>

  <!-- Active Groove Highlight (Progress / Music bar fill: x=37..56, y=11..30) -->
  <g id="groove-highlight-topleft"><rect x="37" y="11" width="3" height="3" fill="url(#grooveActive)"/></g>
  <g id="groove-highlight-top"><rect x="40" y="11" width="6" height="3" fill="url(#grooveActive)"/></g>
  <g id="groove-highlight-topright"><rect x="46" y="11" width="3" height="3" fill="url(#grooveActive)"/></g>
  <g id="groove-highlight-left"><rect x="37" y="14" width="3" height="6" fill="url(#grooveActive)"/></g>
  <g id="groove-highlight-center"><rect x="40" y="14" width="6" height="6" fill="url(#grooveActive)"/></g>
  <g id="groove-highlight-right"><rect x="46" y="14" width="3" height="6" fill="url(#grooveActive)"/></g>
  <g id="groove-highlight-bottomleft"><rect x="37" y="20" width="3" height="3" fill="url(#grooveActive)"/></g>
  <g id="groove-highlight-bottom"><rect x="40" y="20" width="6" height="3" fill="url(#grooveActive)"/></g>
  <g id="groove-highlight-bottomright"><rect x="46" y="20" width="3" height="3" fill="url(#grooveActive)"/></g>

  <!-- Horizontal Slider Handles (26x26 boxes) -->
  <g id="horizontal-slider-handle">
    <rect x="95" y="0" width="26" height="26" fill="none"/>
    <circle cx="108" cy="13" r="6.5" fill="url(#handleGlow)"/>
    <circle cx="108" cy="13" r="6.5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>

  <g id="horizontal-slider-hover">
    <rect x="95" y="32" width="26" height="26" fill="none"/>
    <circle cx="108" cy="45" r="7.5" fill="url(#handleGlowHover)"/>
    <circle cx="108" cy="45" r="7.5" fill="none" stroke="#00F0FF" stroke-width="1.5"/>
    <circle cx="108" cy="45" r="9.5" fill="none" stroke="#00F0FF" stroke-width="0.8" opacity="0.6"/>
  </g>

  <g id="horizontal-slider-focus">
    <rect x="95" y="64" width="26" height="26" fill="none"/>
    <circle cx="108" cy="77" r="7.0" fill="url(#handleGlowHover)"/>
    <circle cx="108" cy="77" r="7.0" fill="none" stroke="#00F0FF" stroke-width="1.5"/>
  </g>

  <g id="horizontal-slider-shadow">
    <rect x="95" y="96" width="26" height="26" fill="none"/>
    <circle cx="108" cy="109" r="6.5" fill="#000000" opacity="0.4"/>
  </g>

  <!-- Vertical Slider Handles (26x26 boxes) -->
  <g id="vertical-slider-handle">
    <rect x="0" y="95" width="26" height="26" fill="none"/>
    <circle cx="13" cy="108" r="6.5" fill="url(#handleGlow)"/>
    <circle cx="13" cy="108" r="6.5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>

  <g id="vertical-slider-hover">
    <rect x="32" y="95" width="26" height="26" fill="none"/>
    <circle cx="45" cy="108" r="7.5" fill="url(#handleGlowHover)"/>
    <circle cx="45" cy="108" r="7.5" fill="none" stroke="#00F0FF" stroke-width="1.5"/>
    <circle cx="45" cy="108" r="9.5" fill="none" stroke="#00F0FF" stroke-width="0.8" opacity="0.6"/>
  </g>

  <g id="vertical-slider-focus">
    <rect x="64" y="95" width="26" height="26" fill="none"/>
    <circle cx="77" cy="108" r="7.0" fill="url(#handleGlowHover)"/>
    <circle cx="77" cy="108" r="7.0" fill="none" stroke="#00F0FF" stroke-width="1.5"/>
  </g>

  <g id="vertical-slider-shadow">
    <rect x="95" y="95" width="26" height="26" fill="none"/>
    <circle cx="108" cy="108" r="6.5" fill="#000000" opacity="0.4"/>
  </g>
</svg>
