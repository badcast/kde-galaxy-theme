<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color:#F8FAFC; }
      .ColorScheme-Background { color:#0F1426; }
      .ColorScheme-Highlight { color:#00F0FF; }
      .ColorScheme-ButtonBackground { color:#1A2238; }
      .ColorScheme-Positive { color:#10B981; }
    </style>
    <radialGradient id="handleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </radialGradient>
    <linearGradient id="grooveActiveFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0096D6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="peakAudioGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect id="hint-tile-center" x="0" y="0" width="2" height="2" fill="none"/>
  <rect id="hint-stretch-borders" x="0" y="0" width="1" height="1" fill="none"/>
  <rect id="hint-handle-size" x="0" y="0" width="16" height="16" fill="none"/>

  <!-- ========================================== -->
  <!-- 1. INACTIVE GROOVE TRACK                   -->
  <!-- ========================================== -->
  <g id="groove-center"><rect x="6" y="6" width="8" height="8" fill="#0B0E17" fill-opacity="0.9"/></g>
  <g id="groove-topleft"><path d="M 0 6 A 6 6 0 0 1 6 0 L 6 6 Z" fill="#0B0E17" fill-opacity="0.9"/><path d="M 0 6 A 6 6 0 0 1 6 0" stroke="#2A3558" stroke-width="1" fill="none"/></g>
  <g id="groove-top"><rect x="6" y="0" width="8" height="6" fill="#0B0E17" fill-opacity="0.9"/><line x1="6" y1="0.5" x2="14" y2="0.5" stroke="#2A3558" stroke-width="1"/></g>
  <g id="groove-topright"><path d="M 14 0 A 6 6 0 0 1 20 6 L 14 6 Z" fill="#0B0E17" fill-opacity="0.9"/><path d="M 14 0 A 6 6 0 0 1 20 6" stroke="#2A3558" stroke-width="1" fill="none"/></g>
  <g id="groove-left"><rect x="0" y="6" width="6" height="8" fill="#0B0E17" fill-opacity="0.9"/><line x1="0.5" y1="6" x2="0.5" y2="14" stroke="#2A3558" stroke-width="1"/></g>
  <g id="groove-right"><rect x="14" y="6" width="6" height="8" fill="#0B0E17" fill-opacity="0.9"/><line x1="19.5" y1="6" x2="19.5" y2="14" stroke="#2A3558" stroke-width="1"/></g>
  <g id="groove-bottomleft"><path d="M 6 20 A 6 6 0 0 1 0 14 L 6 14 Z" fill="#0B0E17" fill-opacity="0.9"/><path d="M 6 20 A 6 6 0 0 1 0 14" stroke="#2A3558" stroke-width="1" fill="none"/></g>
  <g id="groove-bottom"><rect x="6" y="14" width="8" height="6" fill="#0B0E17" fill-opacity="0.9"/><line x1="6" y1="19.5" x2="14" y2="19.5" stroke="#2A3558" stroke-width="1"/></g>
  <g id="groove-bottomright"><path d="M 20 14 A 6 6 0 0 1 14 20 L 14 14 Z" fill="#0B0E17" fill-opacity="0.9"/><path d="M 20 14 A 6 6 0 0 1 14 20" stroke="#2A3558" stroke-width="1" fill="none"/></g>

  <!-- ========================================== -->
  <!-- 2. ACTIVE GROOVE HIGHLIGHT (Set Volume)    -->
  <!-- ========================================== -->
  <g id="groove-highlight-center"><rect x="36" y="6" width="8" height="8" fill="url(#grooveActiveFill)"/></g>
  <g id="groove-highlight-topleft"><path d="M 30 6 A 6 6 0 0 1 36 0 L 36 6 Z" fill="url(#grooveActiveFill)"/><path d="M 30 6 A 6 6 0 0 1 36 0" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6" fill="none"/></g>
  <g id="groove-highlight-top"><rect x="36" y="0" width="8" height="6" fill="url(#grooveActiveFill)"/><line x1="36" y1="0.5" x2="44" y2="0.5" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6"/></g>
  <g id="groove-highlight-topright"><path d="M 44 0 A 6 6 0 0 1 50 6 L 44 6 Z" fill="url(#grooveActiveFill)"/><path d="M 44 0 A 6 6 0 0 1 50 6" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6" fill="none"/></g>
  <g id="groove-highlight-left"><rect x="30" y="6" width="6" height="8" fill="url(#grooveActiveFill)"/><line x1="30.5" y1="6" x2="30.5" y2="14" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6"/></g>
  <g id="groove-highlight-right"><rect x="44" y="6" width="6" height="8" fill="url(#grooveActiveFill)"/><line x1="49.5" y1="6" x2="49.5" y2="14" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6"/></g>
  <g id="groove-highlight-bottomleft"><path d="M 36 20 A 6 6 0 0 1 30 14 L 36 14 Z" fill="url(#grooveActiveFill)"/><path d="M 36 20 A 6 6 0 0 1 30 14" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6" fill="none"/></g>
  <g id="groove-highlight-bottom"><rect x="36" y="14" width="8" height="6" fill="url(#grooveActiveFill)"/><line x1="36" y1="19.5" x2="44" y2="19.5" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6"/></g>
  <g id="groove-highlight-bottomright"><path d="M 50 14 A 6 6 0 0 1 44 20 L 44 14 Z" fill="url(#grooveActiveFill)"/><path d="M 50 14 A 6 6 0 0 1 44 20" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6" fill="none"/></g>

  <!-- ========================================== -->
  <!-- 3. SELECTED PEAK AUDIO METER (Live bounce) -->
  <!-- ========================================== -->
  <g id="selected-groove-highlight-center"><rect x="66" y="6" width="8" height="8" fill="url(#peakAudioGrad)"/></g>
  <g id="selected-groove-highlight-topleft"><path d="M 60 6 A 6 6 0 0 1 66 0 L 66 6 Z" fill="url(#peakAudioGrad)"/><path d="M 60 6 A 6 6 0 0 1 66 0" stroke="#10B981" stroke-width="1.2" fill="none"/></g>
  <g id="selected-groove-highlight-top"><rect x="66" y="0" width="8" height="6" fill="url(#peakAudioGrad)"/><line x1="66" y1="0.5" x2="74" y2="0.5" stroke="#10B981" stroke-width="1.2"/></g>
  <g id="selected-groove-highlight-topright"><path d="M 74 0 A 6 6 0 0 1 80 6 L 74 6 Z" fill="url(#peakAudioGrad)"/><path d="M 74 0 A 6 6 0 0 1 80 6" stroke="#10B981" stroke-width="1.2" fill="none"/></g>
  <g id="selected-groove-highlight-left"><rect x="60" y="6" width="6" height="8" fill="url(#peakAudioGrad)"/><line x1="60.5" y1="6" x2="60.5" y2="14" stroke="#10B981" stroke-width="1.2"/></g>
  <g id="selected-groove-highlight-right"><rect x="74" y="6" width="6" height="8" fill="url(#peakAudioGrad)"/><line x1="79.5" y1="6" x2="79.5" y2="14" stroke="#10B981" stroke-width="1.2"/></g>
  <g id="selected-groove-highlight-bottomleft"><path d="M 66 20 A 6 6 0 0 1 60 14 L 66 14 Z" fill="url(#peakAudioGrad)"/><path d="M 66 20 A 6 6 0 0 1 60 14" stroke="#10B981" stroke-width="1.2" fill="none"/></g>
  <g id="selected-groove-highlight-bottom"><rect x="66" y="14" width="8" height="6" fill="url(#peakAudioGrad)"/><line x1="66" y1="19.5" x2="74" y2="19.5" stroke="#10B981" stroke-width="1.2"/></g>
  <g id="selected-groove-highlight-bottomright"><path d="M 80 14 A 6 6 0 0 1 74 20 L 74 14 Z" fill="url(#peakAudioGrad)"/><path d="M 80 14 A 6 6 0 0 1 74 20" stroke="#10B981" stroke-width="1.2" fill="none"/></g>

  <!-- Compatibility aliases for Selected FrameSvg prefix -->
  <use id="groove-highlight-selected-center" href="#selected-groove-highlight-center"/>
  <use id="groove-highlight-selected-topleft" href="#selected-groove-highlight-topleft"/>
  <use id="groove-highlight-selected-top" href="#selected-groove-highlight-top"/>
  <use id="groove-highlight-selected-topright" href="#selected-groove-highlight-topright"/>
  <use id="groove-highlight-selected-left" href="#selected-groove-highlight-left"/>
  <use id="groove-highlight-selected-right" href="#selected-groove-highlight-right"/>
  <use id="groove-highlight-selected-bottomleft" href="#selected-groove-highlight-bottomleft"/>
  <use id="groove-highlight-selected-bottom" href="#selected-groove-highlight-bottom"/>
  <use id="groove-highlight-selected-bottomright" href="#selected-groove-highlight-bottomright"/>

  <!-- ========================================== -->
  <!-- 4. SLIDER HANDLES                          -->
  <!-- ========================================== -->
  <g id="horizontal-slider-handle">
    <circle cx="100" cy="20" r="7" fill="url(#handleGrad)"/>
    <circle cx="100" cy="20" r="7" fill="none" stroke="#0096D6" stroke-width="1.5"/>
  </g>
  <g id="horizontal-slider-hover">
    <circle cx="125" cy="20" r="8" fill="url(#handleGrad)"/>
    <circle cx="125" cy="20" r="8" fill="none" stroke="#00F0FF" stroke-width="2.0"/>
  </g>
  <g id="horizontal-slider-focus">
    <circle cx="100" cy="50" r="7" fill="url(#handleGrad)"/>
    <circle cx="100" cy="50" r="7" fill="none" stroke="#00F0FF" stroke-width="2.0"/>
  </g>
  <g id="horizontal-slider-shadow"><circle cx="125" cy="50" r="7" fill="#000000" opacity="0.4"/></g>

  <g id="vertical-slider-handle">
    <circle cx="20" cy="70" r="7" fill="url(#handleGrad)"/>
    <circle cx="20" cy="70" r="7" fill="none" stroke="#0096D6" stroke-width="1.5"/>
  </g>
  <g id="vertical-slider-hover">
    <circle cx="45" cy="70" r="8" fill="url(#handleGrad)"/>
    <circle cx="45" cy="70" r="8" fill="none" stroke="#00F0FF" stroke-width="2.0"/>
  </g>
  <g id="vertical-slider-focus">
    <circle cx="20" cy="95" r="7" fill="url(#handleGrad)"/>
    <circle cx="20" cy="95" r="7" fill="none" stroke="#00F0FF" stroke-width="2.0"/>
  </g>
  <g id="vertical-slider-shadow"><circle cx="45" cy="95" r="7" fill="#000000" opacity="0.4"/></g>
</svg>
